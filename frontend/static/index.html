<body>
    <!-- ВАЖНО: ниже находится существующая разметка сайта. -->
    <!-- Authentication logic is defined at the end of this document. -->

    <!-- ===== МОДАЛЬНОЕ ОКНО ВХОДА ===== -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <div class="modal-header">
                <h3>🔐 Вход</h3>
                <button class="modal-close" type="button" onclick="closeModal('loginModal')">✕</button>
            </div>
            <div class="modal-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginUsername">Имя пользователя</label>
                        <input type="text" id="loginUsername" placeholder="Введите имя пользователя" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Пароль</label>
                        <input type="password" id="loginPassword" placeholder="Введите пароль" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Войти</button>
                    <div class="auth-switch">
                        Нет аккаунта? <a href="#" id="openRegisterFromLogin">Зарегистрируйтесь</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО РЕГИСТРАЦИИ ===== -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal">
            <div class="modal-header">
                <h3>📝 Регистрация</h3>
                <button class="modal-close" type="button" onclick="closeModal('registerModal')">✕</button>
            </div>
            <div class="modal-body">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regUsername">Имя пользователя *</label>
                        <input type="text" id="regUsername" placeholder="От 3 до 50 символов" autocomplete="username" required minlength="3" maxlength="50">
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email *</label>
                        <input type="email" id="regEmail" placeholder="example@mail.com" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label for="regFirstName">Имя</label>
                        <input type="text" id="regFirstName" placeholder="Ваше имя" autocomplete="given-name">
                    </div>
                    <div class="form-group">
                        <label for="regLastName">Фамилия</label>
                        <input type="text" id="regLastName" placeholder="Ваша фамилия" autocomplete="family-name">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Пароль *</label>
                        <input type="password" id="regPassword" placeholder="Минимум 6 символов" autocomplete="new-password" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                    <div class="auth-switch">
                        Уже есть аккаунт? <a href="#" id="openLoginFromRegister">Войдите</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // AUTHENTICATION
        // ============================================================
        // When frontend is served by Spring Boot, use the same origin.
        // When frontend is hosted elsewhere, set window.AUTH_API_URL
        // before this script to the public Spring Boot API URL.
        const API_URL = window.AUTH_API_URL || (
            window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'http://localhost:8080/api/v1'
                : '/api/v1'
        );

        function openLogin() {
            const modal = document.getElementById('loginModal');
            if (!modal) return;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            const input = document.getElementById('loginUsername');
            if (input) setTimeout(() => input.focus(), 50);
        }

        function openRegister() {
            const modal = document.getElementById('registerModal');
            if (!modal) return;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            const input = document.getElementById('regUsername');
            if (input) setTimeout(() => input.focus(), 50);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        function showNotification(message, type = 'success') {
            const existing = document.querySelector('.notification-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'notification-toast' + (type === 'error' ? ' error' : '');
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'notifOut 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function readApiError(response, fallback) {
            try {
                const data = await response.json();
                if (data && data.message) return data.message;
                if (data && data.error) return data.error;
                if (data && data.errors) return Object.values(data.errors).join(', ');
            } catch (_) {
                // Response may not contain JSON.
            }
            return fallback;
        }

        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('loginUsername')?.value.trim();
            const password = document.getElementById('loginPassword')?.value || '';

            if (!username || !password) {
                showNotification('❌ Заполните имя пользователя и пароль', 'error');
                return;
            }

            try {
                const response = await fetch(API_URL + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    throw new Error(await readApiError(response, 'Ошибка входа. Проверьте имя пользователя и пароль.'));
                }

                const data = await response.json();
                if (!data.token) throw new Error('Сервер не вернул JWT токен.');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify({
                    username: data.username,
                    email: data.email,
                    firstName: data.firstName || data.username,
                    lastName: data.lastName || ''
                }));

                updateAuthUI(true);
                closeModal('loginModal');
                document.getElementById('loginForm')?.reset();
                showNotification('✅ Добро пожаловать, ' + (data.firstName || data.username) + '!');
            } catch (error) {
                console.error('Login error:', error);
                showNotification('❌ ' + (error.message || 'Не удалось выполнить вход.'), 'error');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();

            const username = document.getElementById('regUsername')?.value.trim();
            const email = document.getElementById('regEmail')?.value.trim();
            const firstName = document.getElementById('regFirstName')?.value.trim() || '';
            const lastName = document.getElementById('regLastName')?.value.trim() || '';
            const password = document.getElementById('regPassword')?.value || '';

            if (!username || !email || !password) {
                showNotification('❌ Заполните все обязательные поля', 'error');
                return;
            }

            try {
                const response = await fetch(API_URL + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ username, email, firstName, lastName, password })
                });

                if (!response.ok) {
                    throw new Error(await readApiError(response, 'Ошибка регистрации. Возможно, пользователь уже существует.'));
                }

                const data = await response.json();
                if (!data.token) throw new Error('Сервер зарегистрировал пользователя, но не вернул JWT токен.');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify({
                    username: data.username,
                    email: data.email,
                    firstName: data.firstName || data.username,
                    lastName: data.lastName || ''
                }));

                updateAuthUI(true);
                closeModal('registerModal');
                document.getElementById('registerForm')?.reset();
                showNotification('✅ Регистрация успешна! Добро пожаловать, ' + (data.firstName || data.username) + '!');
            } catch (error) {
                console.error('Registration error:', error);
                showNotification('❌ ' + (error.message || 'Не удалось выполнить регистрацию.'), 'error');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            updateAuthUI(false);
            showNotification('👋 Вы вышли из системы');
        }

        function updateAuthUI(isLoggedIn) {
            const authButtons = document.getElementById('authButtons');
            if (!authButtons) return;

            if (isLoggedIn) {
                let user = {};
                try {
                    user = JSON.parse(localStorage.getItem('user') || '{}');
                } catch (_) {}

                const name = user.firstName || user.username || 'Пользователь';
                authButtons.innerHTML = `
                    <span class="user-name">👤 ${escapeHtml(name)}</span>
                    <button type="button" class="btn-sm btn-outline-sm" id="logoutButton">Выйти</button>
                `;
                document.getElementById('logoutButton')?.addEventListener('click', logout);
            } else {
                authButtons.innerHTML = `
                    <button type="button" class="btn-sm btn-outline-sm" id="loginButton">Войти</button>
                    <button type="button" class="btn-sm btn-primary-sm" id="registerButton">Регистрация</button>
                `;
                document.getElementById('loginButton')?.addEventListener('click', openLogin);
                document.getElementById('registerButton')?.addEventListener('click', openRegister);
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.modal-overlay').forEach(modal => {
                modal.addEventListener('click', event => {
                    if (event.target === modal) closeModal(modal.id);
                });
            });

            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') {
                    document.querySelectorAll('.modal-overlay.active').forEach(modal => closeModal(modal.id));
                }
            });

            document.getElementById('loginForm')?.addEventListener('submit', handleLogin);
            document.getElementById('registerForm')?.addEventListener('submit', handleRegister);

            document.getElementById('openRegisterFromLogin')?.addEventListener('click', event => {
                event.preventDefault();
                closeModal('loginModal');
                openRegister();
            });

            document.getElementById('openLoginFromRegister')?.addEventListener('click', event => {
                event.preventDefault();
                closeModal('registerModal');
                openLogin();
            });

            updateAuthUI(!!localStorage.getItem('token'));
        });

        // Public API for existing onclick handlers on the site.
        window.openLogin = openLogin;
        window.openRegister = openRegister;
        window.closeModal = closeModal;
        window.handleLogin = handleLogin;
        window.handleRegister = handleRegister;
        window.logout = logout;
        window.showNotification = showNotification;
    </script>

</body>
