server:
  port: 8080

spring:
  application:
    name: promtechsoft

  web:
    resources:
      static-locations: classpath:/static/, file:frontend/static/

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/promtechsoft
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

# JWT настройки
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000  # 24 часа в миллисекундах

logging:
  level:
    root: INFO
    com.promtechsoft: DEBUG